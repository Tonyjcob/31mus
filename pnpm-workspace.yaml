packages:
  - apps/*
  - packages/*

# Versiones exactas al añadir dependencias (Dependabot se encarga de subirlas).
saveExact: true

# Solo estas dependencias pueden ejecutar scripts de instalación.
# esbuild (lo usa tsx) descarga y verifica su binario nativo.
allowBuilds:
  esbuild: true
  # Acelerador nativo opcional de msgpackr (lo usa Colyseus); sin él funciona en JS puro.
  msgpackr-extract: false
